    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 8%;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        nav a:hover {
            color: #60a5fa;
        }

        main {
            max-width: 800px;
            margin: auto;
            padding: 60px 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-title h1 {
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            color: #111827;
            margin-bottom: 10px;
        }

        .page-title p {
            color: #6b7280;
        }

        .contact-card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .contact-card > p {
            margin-bottom: 25px;
            color: #4b5563;
        }

        .email {
            display: inline-block;
            margin-bottom: 25px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .email:hover {
            text-decoration: underline;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #111827;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-family: inherit;
            font-size: 1rem;
        }

        input:focus,
        textarea:focus {
            outline: 2px solid #2563eb;
            border-color: #2563eb;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px 25px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        footer {
            margin-top: 40px;
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
            }

            nav ul {
                gap: 15px;
            }

            .contact-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-container">

        <div class="logo">
            Michelle Mahinay
        </div>

        <nav aria-label="Main navigation">
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="contact.html">Contact</a>
                </li>
            </ul>
        </nav>

    </div>
</header>

<main>

    <section class="page-title">

        <h1>Contact Me</h1>

        <p>
            Feel free to send me a message.
        </p>

    </section>

    <section class="contact-card">

        <p>
            If you would like to get in touch with me,
            you can use the form below.
        </p>

        <a
            class="email"
            href="mailto:michellemahinay942@gmail.com"
        >
            michellemahinay942@gmail.com
        </a>

        <form action="#" method="post">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    minlength="2"
                    autocomplete="name"
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email"
                >

            </div>

            <div class="form-group">

                <label for="phone">
                    Phone Number (Optional)
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    pattern="[0-9\-\s]{7,}"
                    autocomplete="tel"
                >

            </div>

            <div class="form-group">

                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    required
                ></textarea>

            </div>

            <button type="submit">
                Send Message
            </button>

        </form>

    </section>

</main>

<footer>
    <p>
        &copy; 2026 Michelle Mahinay. All rights reserved.
    </p>
</footer>

</body>
</html>
